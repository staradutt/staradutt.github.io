<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <pattern id="lattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.6" fill="rgba(255,255,255,0.14)"/>
      <circle cx="60" cy="0" r="1.6" fill="rgba(255,255,255,0.14)"/>
      <circle cx="0" cy="60" r="1.6" fill="rgba(255,255,255,0.14)"/>
      <circle cx="60" cy="60" r="1.6" fill="rgba(255,255,255,0.14)"/>
      <circle cx="30" cy="30" r="1.6" fill="rgba(255,255,255,0.14)"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="0" y1="0" x2="30" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="60" y1="0" x2="30" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="0" y1="60" x2="30" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="60" y1="60" x2="30" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="60" height="60" fill="url(#lattice)"/>
</svg>
